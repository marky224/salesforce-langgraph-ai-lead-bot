      EXCERPTS>>>\\n[\\n {\\n  \\\"n\\\": 1,\\n  \\\"page\\\": \\\"TARS Conversational
      AI Sales Lead Bot\\\",\\n  \\\"section\\\": \\\"Overview\\\",\\n  \\\"text\\\":
      \\\"An end-to-end lead generation system that qualifies prospects through natural
      conversation and hands off to Salesforce + Agentforce for automated follow-up
      \u2014 running live in the chat bubble on this site.\\\\nYear: 2026\\\\nRole:
      Architect \xB7 Builder\\\\nStatus: Deployed \xB7 Live Demo\\\\nSource: marky224/salesforce-langgraph-ai-lead-bot\\\\nTags:
      Python, LangGraph, LangSmith, FastAPI, Salesforce, Agentforce, Apex, Azure,
      Postgres, LLM, AI, SSE Streaming, CRM Automation\\\\n// cover \xB7 TARS greeting
      a visitor from the floating chat bubble on this site\\\\nSales teams spend an
      enormous amount of time doing the same five things on every inbound lead: asking
      about pain points, qualifying budget and timeline, capturing contact info, logging
      the conversation, and scheduling follow-up. It's repetitive, it doesn't scale,
      and it's the sort of work an LLM was arguably built for \u2014 except most \\\\\\\"AI
      chatbots\\\\\\\" still feel like branching decision trees with a language model
      bolted on top.\\\\nI wanted to build something different: a chatbot that actually
      feels like a conversation, that can hold state across turns, that plugs into
      a real CRM, and that hands finished leads to an AI agent for follow-up rather
      than dumping them in a queue. The result is TARS \u2014 live right now in the
      chat bubble at the bottom-right of this page.\\\"\\n },\\n {\\n  \\\"n\\\":
      2,\\n  \\\"page\\\": \\\"TARS Conversational AI Sales Lead Bot\\\",\\n  \\\"section\\\":
      \\\"The Challenge\\\",\\n  \\\"text\\\": \\\"Two problems were really one problem.
      First: manual lead qualification doesn't scale. A small consulting practice
      can't have a human answering every \\\\\\\"hey, do you do X?\\\\\\\" message
      at 11pm on a Tuesday, and most of those conversations end up being unqualified
      anyway. Second: the chatbots that try to solve this feel robotic. They ask questions
      in a rigid order, can't handle objections, repeat themselves, and forget context
      the moment the visitor says something unexpected.\\\\nThe brief I set for myself:
      build a sales bot that holds a natural, multi-turn conversation, qualifies the
      lead against real criteria (budget, timeline, company size, decision-maker status,
      pain points), captures contact info without feeling pushy, and hands off to
      Salesforce the moment it's done \u2014 with an AI follow-up agent taking over
      from there. No humans in the loop from first hello to follow-up email draft.\\\"\\n
      },\\n {\\n  \\\"n\\\": 3,\\n  \\\"page\\\": \\\"TARS Conversational AI Sales
      Lead Bot\\\",\\n  \\\"section\\\": \\\"Results\\\",\\n  \\\"text\\\": \\\"Embedded
      on this site\\\\nClick the bubble in the bottom-right of any page. It's the
      real system, not a mockup.\\\\nEnd-to-end automation\\\\nChat bubble click \u2192
      Salesforce Lead \u2192 Agentforce follow-up, zero humans required.\\\\n150+
      test functions\\\\nNode, tool, server, end-to-end, and eval tests, counted in
      the repo. CI runs the unit suite and recorded evals on every PR.\\\\nScale-to-zero
      hosting\\\\nAzure Container Apps free tier \u2014 the backend costs nothing
      when idle.\\\\nProvider-swappable\\\\nClaude, GPT-4o, Llama (via Groq) or Grok
      \u2014 one env var plus that provider's API key, redeploy, done. Prod runs Grok
      (grok-4.3).\\\\nAPI-first design\\\\nFully documented Swagger UI. Any frontend
      can consume the same backend.\\\\n// FastAPI Swagger UI \u2014 the backend exposes
      a clean REST surface, not just a widget endpoint\\\\nThe backend API is publicly
